<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monsters Clash | Battle Sandbox</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#eaf3ff;font-family:system-ui,Arial}main{max-width:1120px;padding:18px;margin:auto}h1{margin:0;font-size:26px}.muted{color:#b2c1d3;font-size:13px}header,.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}select,button{background:#263d57;color:white;border:1px solid #57728b;border-radius:10px;padding:10px;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}canvas{display:block;width:100%;height:auto;border:2px solid #6d8493;border-radius:16px;background:#c5e8f3;margin-top:13px}.toolbar{margin-top:12px}.cards{display:flex;gap:10px;flex-wrap:wrap}.cards button{display:flex;gap:8px;align-items:center;min-width:160px}.cards img{width:53px;height:53px}.status{margin-top:10px;font-weight:700;color:#e9d58b}</style></head><body><main><header><div><h1>⚔ Monsters Clash</h1><div class="muted">Elemental collection battle · Two-monster combat test</div></div><label>Battlefield <select id="stage"></select></label></header><canvas id="game" width="960" height="480"></canvas><div class="toolbar"><div class="cards" id="cards"></div><div><strong id="mana"></strong> <button id="restart">Restart</button></div></div><div id="status" class="status">Summon units from the left and destroy the enemy base.</div><p class="muted">Mossguard and Cinderhorn use single-SVG animation transforms; eight more monster records are ready for future artwork. No account or backend required.</p></main><script>
const $=id=>document.getElementById(id);const cv=$('game'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height,ground=365;
let roster=[],stages=[],images={},state,cooldowns={},last=performance.now(),enemyTimer=2;
async function init(){const [a,b]=await Promise.all([fetch('monsters/m001.json'),fetch('monsters/m002.json')]);roster=[await a.json(),await b.json()];stages=await(await fetch('stage_affinities.json')).json();if(!Array.isArray(stages))stages=stages.stages||[];for(const s of stages){const o=document.createElement('option');o.value=s.id;o.textContent=s.name+' · '+s.affinity;$('stage').append(o)}for(const m of roster){const img=new Image();img.src=m.art.battle_side;images[m.id]=img;const btn=document.createElement('button');btn.id='card_'+m.id;btn.innerHTML='<img src="'+m.art.front+'" alt=""><span>'+m.name+'<br><small>'+m.deployment.mana_cost+' mana</small></span>';btn.onclick=()=>spawn(m,1);$('cards').append(btn)}$('stage').onchange=reset;$('restart').onclick=reset;reset();requestAnimationFrame(frame)}
function reset(){state={units:[],mana:5,allyBase:1900,enemyBase:1900,time:0,ended:false};cooldowns={};enemyTimer=2;$('status').textContent='Summon monsters and destroy the enemy base.'}
function stage(){return stages.find(s=>s.id===$('stage').value)||stages[0]}function mods(m){const s=stage();return s&&m.element!=='neutral'&&m.element===s.affinity?s.modifier:{outgoing_damage_bonus_pct:0,incoming_damage_reduction_pct:0,max_hp_bonus_pct:0}}
function spawn(m,side){if(state.ended)return;if(side===1){if(state.mana<m.deployment.mana_cost||(cooldowns[m.id]||0)>0)return;state.mana-=m.deployment.mana_cost;cooldowns[m.id]=m.deployment.cooldown_seconds}const b=mods(m),hp=m.stats.hp*(1+(b.max_hp_bonus_pct||0));state.units.push({m,side,x:side>0?95:865,hp,maxhp:hp,shield:0,atk:.5,skill:m.skill.cooldown_seconds,motion:0,hit:0,phase:Math.random()*6,mod:b})}
function dmg(u,amount){const reduction=(u.mod.incoming_damage_reduction_pct||0);amount*=1-reduction;if(u.m.passive.id==='bark_shell'&&u.hp/u.maxhp>.5)amount*=.88;const shield=Math.min(u.shield,amount);u.shield-=shield;u.hp-=amount-shield;u.hit=.15}
function step(dt){if(state.ended)return;state.time+=dt;state.mana=Math.min(12,state.mana+dt);for(const k of Object.keys(cooldowns))cooldowns[k]=Math.max(0,cooldowns[k]-dt);enemyTimer-=dt;if(enemyTimer<=0){spawn(roster[Math.random()<.55?0:1],-1);enemyTimer=3.1+Math.random()*1.5}for(const u of state.units){if(u.hp<=0)continue;u.phase+=dt*(u.m.ai.locomotion==='gallop'?12:7);u.hit=Math.max(0,u.hit-dt);u.motion=Math.max(0,u.motion-dt);u.atk-=dt;u.skill-=dt;const targets=state.units.filter(t=>t.side!==u.side&&t.hp>0).sort((a,b)=>Math.abs(a.x-u.x)-Math.abs(b.x-u.x));const target=targets[0];const dist=target?Math.abs(u.x-target.x):Math.abs((u.side>0?904:56)-u.x);const inrange=dist<=u.m.attack.range+30;if(!inrange)u.x=Math.max(55,Math.min(905,u.x+u.m.stats.move_speed*dt*u.side));else if(u.atk<=0){const amount=u.m.attack.base_damage*(1+(u.mod.outgoing_damage_bonus_pct||0));if(target)dmg(target,amount);else if(u.side>0)state.enemyBase-=amount;else state.allyBase-=amount;u.atk=u.m.attack.interval_seconds;u.motion=.24}if(u.skill<=0){if(u.m.skill.effect.type==='shield_self')u.shield=Math.max(u.shield,u.m.skill.effect.amount);else if(u.m.skill.effect.type==='dash_hit'){u.x+=u.side*u.m.skill.effect.distance;if(target)dmg(target,u.m.skill.effect.damage*(1+(u.mod.outgoing_damage_bonus_pct||0)))}u.skill=u.m.skill.cooldown_seconds}}state.units=state.units.filter(u=>u.hp>0);if(state.enemyBase<=0||state.allyBase<=0){state.ended=true;$('status').textContent=state.enemyBase<=0?'Victory — enemy base destroyed!':'Defeat — player base destroyed!'}}
function draw(){const s=stage(),colors={nature:['#78ceff','#95cb79','#7dbe57'],fire:['#f87b52','#a84c35','#b75c3d'],ice:['#b6e7ff','#a5d3e5','#cceaf5'],earth:['#b5c5cf','#9b927f','#bfae85'],neutral:['#93cce7','#81a081','#9eb982']}[s?.affinity]||['#8ed1ef','#89bd73','#92c269'];const grad=ctx.createLinearGradient(0,0,0,ground);grad.addColorStop(0,colors[0]);grad.addColorStop(1,colors[1]);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle=colors[2];ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#446b48';ctx.fillRect(0,ground,W,5);
for(const base of [{x:20,c:'#4d8cc1',v:state.allyBase},{x:884,c:'#aa5364',v:state.enemyBase}]){ctx.fillStyle=base.c;ctx.fillRect(base.x,222,56,143);ctx.fillStyle='#263950';ctx.fillRect(base.x-5,210,66,16);ctx.fillStyle='#1b293f';ctx.fillRect(base.x,199,56,8);ctx.fillStyle='#f67b6a';ctx.fillRect(base.x,199,56*Math.max(0,base.v/1900),8)}
for(const u of state.units){const img=images[u.m.id],sz=u.m.id==='m001'?95:91;ctx.save();ctx.translate(u.x,ground-4+(Math.sin(u.phase)*3));ctx.scale(u.side,1);if(u.motion>0)ctx.translate(10*u.motion/.24,0);if(u.hit>0)ctx.globalAlpha=.58;if(img?.complete&&img.naturalWidth)ctx.drawImage(img,-sz/2,-sz,sz,sz);else{ctx.fillStyle='#fff';ctx.fillRect(-20,-60,40,60)}ctx.restore();ctx.fillStyle='#223044';ctx.fillRect(u.x-32,ground-sz-21,64,7);ctx.fillStyle=u.side>0?'#6dde8a':'#fa7777';ctx.fillRect(u.x-32,ground-sz-21,64*Math.max(0,u.hp/u.maxhp),7)}
ctx.fillStyle='#1b3755';ctx.fillRect(328,12,304,40);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 18px system-ui';ctx.fillText(s?.name||'Battlefield',480,38);if(state.ended){ctx.fillStyle='#08172cbb';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.font='bold 52px system-ui';ctx.fillText(state.enemyBase<=0?'VICTORY':'DEFEAT',480,240)}$('mana').textContent='Mana '+state.mana.toFixed(1)+'/12';for(const m of roster){const btn=$('card_'+m.id);btn.disabled=state.ended||state.mana<m.deployment.mana_cost||(cooldowns[m.id]||0)>0;btn.title=(cooldowns[m.id]||0)>0?'Cooldown '+cooldowns[m.id].toFixed(1)+'s':''}}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);draw();requestAnimationFrame(frame)}init().catch(e=>{$('status').textContent='Loading failed: '+e.message});
</script></body></html>
